# Unified environment for Garment Motion Generation Pipeline
# Combines: Segment Anything (SAM), InstructPix2Pix, and MotionModes

name: garment-pipeline
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.10

  # PyTorch with CUDA 11.7
  - pytorch=1.13.1
  - torchvision=0.14.1
  - torchaudio=0.13.1
  - pytorch-cuda=11.7

  # Core scientific packages
  - numpy>=1.19.2
  - scipy>=1.10.0
  - pandas>=1.5.0
  - matplotlib>=3.6.0

  # Image processing
  - pillow>=9.0.0
  - opencv>=4.6.0

  # Video processing
  - ffmpeg>=4.3

  # Build tools
  - pip>=23.0
  - setuptools>=65.0
  - wheel>=0.40.0

  # Additional dependencies
  - pyyaml>=6.0
  - tqdm>=4.65.0
  - requests>=2.28.0

  - pip:
      # ===== Segment Anything (SAM) =====
      - segment-anything @ git+https://github.com/facebookresearch/segment-anything.git
      - pycocotools>=2.0.6
      - onnx>=1.13.0
      - onnxruntime>=1.14.0

      # ===== InstructPix2Pix =====
      - albumentations==0.4.3
      - datasets>=2.8.0
      - diffusers>=0.11.1
      - invisible-watermark
      - imageio>=2.9.0
      - imageio-ffmpeg>=0.4.2
      - pytorch-lightning>=1.4.2
      - omegaconf>=2.1.1
      - test-tube>=0.7.5
      - streamlit>=0.73.1
      - einops>=0.3.0
      - torch-fidelity>=0.3.0
      - torchmetrics>=0.6.0
      - kornia>=0.6
      - openai
      - seaborn
      - k-diffusion @ git+https://github.com/crowsonkb/k-diffusion.git

      # ===== MotionModes =====
      - decord>=0.5.2
      - cupy-cuda12x>=13.0.0
      - gdown>=5.0.0
      - timm>=1.0.0
      - xformers>=0.0.16
      - wandb>=0.17.0

      # ===== Shared dependencies =====
      - transformers>=4.25.0
      - huggingface-hub>=0.20.0
      - safetensors>=0.4.0
      - accelerate>=0.25.0
      
      # Gradio for web interfaces
      - gradio>=3.50.0
      - gradio-client>=0.6.0

      # FastAPI for APIs
      - fastapi>=0.100.0
      - uvicorn>=0.22.0

      # CLIP for image-text similarity
      - clip @ git+https://github.com/openai/CLIP.git

      # Utilities
      - colorlog>=6.0.0
      - beautifulsoup4>=4.12.0
      - regex>=2024.0.0
      - filelock>=3.12.0
      - gitpython>=3.1.0
      - protobuf>=4.0.0
